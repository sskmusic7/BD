<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="shortcut icon" type="image/png" href="%PUBLIC_URL%/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Home-screen install. iOS only delivers Web Push to an installed app,
         so these matter for notifications, not just polish. Older iOS reads
         apple-mobile-web-app-capable rather than the manifest's display. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BodyDouble" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Content Security Policy for Google OAuth -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      worker-src 'self' blob:;
      script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:
        https://accounts.google.com
        https://www.gstatic.com
        https://apis.google.com
        https://cdn.jsdelivr.net;
      script-src-elem 'self' 'unsafe-inline' blob:
        https://accounts.google.com
        https://www.gstatic.com
        https://apis.google.com;
      connect-src 'self' blob:
        http://localhost:*
        http://178.62.45.130
        ws://178.62.45.130:*
        https://sonic-auth.sskmusic.com
        wss://sonic-auth.sskmusic.com
        https://*.convex.cloud
        https://bodydouble-backend-x2x4tp5wra-uc.a.run.app
        https://accounts.google.com
        https://oauth2.googleapis.com
        https://www.googleapis.com
        https://*.gstatic.com
        wss://localhost:* wss:;
      frame-src 'self'
        https://accounts.google.com
        https://accounts.google.com/gsi/;
      img-src 'self' data: https: blob:;
      style-src 'self' 'unsafe-inline' https:;
      font-src 'self' data: https:;
      media-src 'self' blob: data:;
    ">

    <meta
      name="description"
      content="BodyDouble - Find ADHD-friendly focus partners for virtual body doubling sessions"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>BodyDouble - ADHD Focus Partners</title>

    <!-- Google Identity Services (Required for OAuth) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Google API (Optional, for additional Google services) -->
    <script src="https://apis.google.com/js/api.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
